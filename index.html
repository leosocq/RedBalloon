<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/icon.ico">
    <title>Crazy Studio</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@coderline/alphatab/dist/alphaTab.css">
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab/dist/alphaTab.js"></script>
</head>

<body>
    <h1>👻 Red Balloon 🎈</h1>
    <div id="login-screen">
        <input type="password" id="password" placeholder="Mot de passe">
        <button id="login">Entrer</button>
        <div>
            <label>
                <input type="checkbox" id="remember">
                Remember Me
            </label>
        </div>
    </div>

    <div id="app">
        <div class="top-bar">
            <select id="song-select"></select>
            <select id="track-select"></select>
            <button id="solo">Solo</button>
            <button id="mute">Mute</button>
            <button id="play">▶</button>
        </div>

        <div id="tablature"></div>
        <script src="js/songs.js"></script>
        <script src="js/player.js"></script>
        <script src="js/app.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/editer.js"></script>
    </div>

</body>
</html>
